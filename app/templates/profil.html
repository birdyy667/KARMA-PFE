<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>My EV Profile</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 10px; text-align: center; }

        /* --- BADGE DESIGN --- */
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.85em; font-weight: bold; display: inline-block; transition: 0.3s ease; }
        .badge-new { background: #ecf0f1; color: #7f8c8d; border: 1px solid #bdc3c7; }
        .badge-regular { background: #f1c40f; color: #fff; box-shadow: 0 2px 8px rgba(241, 196, 15, 0.4); border: 1px solid #f39c12; }
        .badge-container { text-align: center; margin-bottom: 25px; }

        label { font-weight: bold; color: #555; display: block; margin-top: 15px; font-size: 0.9em; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ddd; font-size: 1em; }
        .btn-save { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: 0.2s; }
        .btn-save:hover { background: #2980b9; }
        .info-tooltip { font-size: 0.8em; color: #7f8c8d; margin-top: 3px; display: block; }
    </style>
</head>
<body>

    <div style="position: absolute; top: 15px; right: 15px; z-index: 1000;" class="menu-container">
        <button style="background: white; border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; color: #2c3e50; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: 0.2s;" onmouseover="this.nextElementSibling.style.display='flex'" onmouseout="setTimeout(() => { if(!this.nextElementSibling.matches(':hover')) this.nextElementSibling.style.display='none' }, 100)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle>
            </svg>
        </button>
        <div style="display: none; position: absolute; right: 0; top: 55px; background: white; min-width: 200px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; flex-direction: column;" onmouseleave="this.style.display='none'" onmouseover="this.style.display='flex'">

            <a href="/" style="color: #2c3e50; padding: 12px 16px; text-decoration: none; font-weight: bold; border-bottom: 1px solid #f4f6f8; display: flex; align-items: center; gap: 10px; transition: background 0.2s;" onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='transparent'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                GPS Map
            </a>

            <a href="/reservations" style="color: #2c3e50; padding: 12px 16px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px; transition: background 0.2s;" onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='transparent'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                My Reservations
            </a>

        </div>
    </div>

    <div class="card">
        <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
            </svg>
            My Profile
        </h2>

        <div class="badge-container">
            <span id="badge-status" class="badge badge-new">Loading...</span>
        </div>

        <label>Name / Username</label>
        <input type="text" id="name">

        <label>Vehicle Model</label>
        <input type="text" id="vehicle" list="vehicle-list" placeholder="e.g., Renault Zoe">

        <datalist id="vehicle-list">
            <option value="Dacia Spring"><option value="Peugeot e-208"><option value="Renault 5 E-Tech 52kWh"><option value="Renault Zoe R110"><option value="Fiat 500e"><option value="Opel Corsa Electric"><option value="Mini Cooper SE"><option value="Renault Megane E-Tech EV60"><option value="MG4 Standard"><option value="Volkswagen ID.3 Pro"><option value="Cupra Born 58kWh"><option value="Citroen e-C4"><option value="Nissan Leaf 40kWh"><option value="BMW i4 eDrive40"><option value="Tesla Model 3 Propulsion"><option value="Tesla Model 3 Grande Autonomie"><option value="Tesla Model Y Propulsion"><option value="Tesla Model Y Grande Autonomie"><option value="Peugeot e-2008"><option value="Renault Scenic E-Tech 87kWh"><option value="Volvo EX30 Single Motor"><option value="Hyundai Kona Electric 64kWh"><option value="Kia Niro EV"><option value="Volkswagen ID.4 Pro"><option value="Skoda Enyaq iV 80"><option value="Audi Q4 e-tron 40"><option value="Hyundai Ioniq 5 RWD"><option value="Kia EV6 RWD"><option value="MG ZS EV Long Range">
        </datalist>

        <label>Battery Capacity (kWh)</label>
        <input type="number" id="battery" step="0.1">

        <label>Average Consumption (kWh/100km)</label>
        <input type="number" id="consumption" step="0.1">
        <span class="info-tooltip">Calculated automatically based on the vehicle.</span>

        <button class="btn-save" onclick="saveProfile()">Save my vehicle</button>
    </div>

    <script>
        const vehicleDatabase = {
            "Dacia Spring": { battery: 26.8, consumption: 12.0 },
            "Fiat 500e": { battery: 37.3, consumption: 14.0 },
            "Renault 5 E-Tech 52kWh": { battery: 52.0, consumption: 14.5 },
            "Peugeot e-208": { battery: 46.3, consumption: 15.0 },
            "Renault Zoe R110": { battery: 52.0, consumption: 16.0 },
            "Tesla Model 3 Propulsion": { battery: 57.5, consumption: 14.5 },
            "Tesla Model Y Propulsion": { battery: 57.5, consumption: 15.2 }
        };

        // --- FUNCTION TO UPDATE LOYALTY BADGE ---
        function updateBadge(pastCharges) {
            const badge = document.getElementById('badge-status');
            if (pastCharges >= 5) {
                badge.textContent = "🌟 Regular Client (VIP)";
                badge.className = "badge badge-regular";
            } else {
                badge.textContent = "🌱 New Client";
                badge.className = "badge badge-new";
            }
        }

        document.getElementById('vehicle').addEventListener('input', function(e) {
            const chosenModel = e.target.value;
            if (vehicleDatabase[chosenModel]) {
                document.getElementById('battery').value = vehicleDatabase[chosenModel].battery;
                document.getElementById('consumption').value = vehicleDatabase[chosenModel].consumption;
            }
        });

        // Load profile data from the Flask backend
        fetch('/api/profil').then(res => res.json()).then(data => {
            if(data.status === "success" && data.profile) {
                document.getElementById('name').value = data.profile.name || "";
                document.getElementById('vehicle').value = data.profile.vehicle || "";
                document.getElementById('battery').value = data.profile.battery_capacity || "";
                document.getElementById('consumption').value = data.profile.consumption || "";

                // Retrieve past charges to display the correct loyalty status
                const pastCharges = data.profile.past_charges || 0;
                updateBadge(pastCharges);
            }
        });

        // Save profile updates back to the server
        function saveProfile() {
            const data = {
                name: document.getElementById('name').value,
                vehicle: document.getElementById('vehicle').value,
                battery_capacity: parseFloat(document.getElementById('battery').value),
                consumption: parseFloat(document.getElementById('consumption').value)
            };

            fetch('/api/profil', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(resData => {
                if(resData.status === "success") {
                    alert("✅ Vehicle saved successfully!");
                }
            });
        }
    </script>
</body>
</html>
