<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>My EV Reservations</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 380px; }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 10px; text-align: center; }

        .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.85em; font-weight: bold; display: inline-block; transition: 0.3s ease; }
        .badge-new { background: #ecf0f1; color: #7f8c8d; border: 1px solid #bdc3c7; }
        .badge-regular { background: #f1c40f; color: #fff; box-shadow: 0 2px 8px rgba(241, 196, 15, 0.4); border: 1px solid #f39c12; }
        .badge-container { text-align: center; margin-bottom: 25px; }

        label { font-weight: bold; color: #555; display: block; margin-top: 15px; font-size: 0.9em; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ddd; font-size: 1em; }
        .input-penalty { background-color: #fdedec; color: #c0392b; border-color: #e74c3c; font-weight: bold; }

        .btn-save { background: #2ecc71; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .btn-save:hover { background: #27ae60; }
        .info-tooltip { font-size: 0.8em; color: #7f8c8d; margin-top: 3px; display: block; }

        .resa-box { display: flex; justify-content: space-between; align-items: center; background: #f0fff4; border: 1px solid #2ecc71; padding: 12px; border-radius: 8px; margin-bottom: 10px; color: #27ae60; font-size: 0.9em; font-weight: bold; }
        .btn-cancel { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-cancel:hover { background: #c0392b; }
    </style>
</head>
<body>

    <div style="position: absolute; top: 15px; right: 15px; z-index: 1000;" class="menu-container">
        <button style="background: white; border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; color: #2c3e50; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.2s;" onmouseover="this.nextElementSibling.style.display='flex'" onmouseout="setTimeout(() => { if(!this.nextElementSibling.matches(':hover')) this.nextElementSibling.style.display='none' }, 100)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle>
            </svg>
        </button>
        <div style="display: none; position: absolute; right: 0; top: 55px; background: white; min-width: 200px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; flex-direction: column;" onmouseleave="this.style.display='none'" onmouseover="this.style.display='flex'">

            <a href="/" style="color: #2c3e50; padding: 12px 16px; text-decoration: none; font-weight: bold; border-bottom: 1px solid #f4f6f8; display: flex; align-items: center; gap: 10px; transition: background 0.2s;" onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='transparent'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                GPS Map
            </a>

            <a href="/profil" style="color: #2c3e50; padding: 12px 16px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px; transition: background 0.2s;" onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='transparent'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                My Profile
            </a>

        </div>
    </div>

    <div class="card">
        <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            My Reservations
        </h2>

        <div class="badge-container">
            <span id="badge-status" class="badge badge-new">Loading...</span>
        </div>

        <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 25px;">
            <label style="margin-top: 0;">Charging history (Demo Mode)</label>
            <input type="number" id="charges" min="0" step="1">
            <span class="info-tooltip">5 charges = VIP Status.</span>

            <label style="color: #c0392b;">Penalty Points (Karma)</label>
            <input type="number" id="karma" class="input-penalty" step="0.1">

            <button class="btn-save" onclick="saveStats()">Force statistics (Demo)</button>
        </div>

        <h3 style="color: #2c3e50; text-align: center; margin-bottom: 15px; border-top: 1px solid #eee; padding-top: 20px;">📅 Active Bookings</h3>
        <div id="reservation-list">
            </div>
    </div>

    <script>
        function updateBadge(pastCharges) {
            const badge = document.getElementById('badge-status');
            if (pastCharges >= 5) {
                badge.textContent = "🌟 Regular Client (VIP)";
                badge.className = "badge badge-regular";
            } else {
                badge.textContent = "🌱 New Client";
                badge.className = "badge badge-new";
            }
        }

        document.getElementById('charges').addEventListener('input', function(e) {
            updateBadge(parseInt(e.target.value) || 0);
        });

        // Load profile and active reservations
        fetch('/api/profil').then(res => res.json()).then(data => {
            if(data.status === "success" && data.profile) {
                const pastCharges = data.profile.past_charges || 0;
                document.getElementById('charges').value = pastCharges;
                document.getElementById('karma').value = data.profile.karma_penalty || 0;

                updateBadge(pastCharges);

                const resContainer = document.getElementById('reservation-list');
                resContainer.innerHTML = '';

                if(data.profile.active_reservations && data.profile.active_reservations.length > 0) {
                    data.profile.active_reservations.forEach(resa => {
                        resContainer.innerHTML += `
                            <div class="resa-box">
                                <div>📍 ${resa.station}<br>⏰ ${resa.hour}</div>
                                <button class="btn-cancel" onclick="cancelReservation('${resa.station}', '${resa.hour}')">Cancel</button>
                            </div>
                        `;
                    });
                } else {
                    resContainer.innerHTML = '<div style="text-align: center; color: #7f8c8d; font-size: 0.9em; font-style: italic;">You have no active reservations.</div>';
                }
            }
        });

        function saveStats() {
            const data = {
                past_charges: parseInt(document.getElementById('charges').value) || 0,
                karma_penalty: parseFloat(document.getElementById('karma').value) || 0
            };
            fetch('/api/profil', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) })
            .then(res => res.json()).then(resData => {
                if(resData.status === "success") alert("✅ Statistics forced for the demo!");
            });
        }

        function cancelReservation(stationId, time) {
            const confirmMsg = "Are you sure you want to cancel this slot?\n\n⚠️ Policy:\n- Over 24h advance: Free\n- Between 2h and 24h: +1 Penalty\n- Less than 2h: +2 Penalty\n- Slot passed (No-show): +3 Penalty";
            if(!confirm(confirmMsg)) return;

            fetch('/api/annuler', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({station_id: stationId, hour: time})
            })
            .then(res => res.json()).then(data => {
                alert(data.message);
                window.location.reload();
            });
        }
    </script>
</body>
</html>
